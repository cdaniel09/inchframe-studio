services:
  - type: web
    name: inchframe-studio
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://studio.inchframe.com
      - key: DATABASE_PATH
        value: /var/data/inchframe-studio.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: AUTH_SECRET
        generateValue: true
      - key: ACCOUNT_SSO_BASE_URL
        value: https://account.inchframe.com
      - key: STUDIO_AUTH_MODE
        value: account
      - key: STUDIO_SSO_CLIENT_ID
        value: studio
      - key: STUDIO_SSO_CLIENT_SECRET
        sync: false
      - key: STUDIO_SSO_REDIRECT_URI
        value: https://studio.inchframe.com/api/auth/account/callback
      - key: ADMIN_EMAIL
        value: info@inchframe.com
      - key: VERIFIED_EMAIL_ALLOWLIST
        value: admin@inchframe.com
      - key: INQUIRY_NOTIFICATION_EMAIL
        value: info@inchframe.com
      - key: STUDIO_MIN_PROJECT_CENTS
        value: 30000
      - key: STUDIO_REVIEW_THRESHOLD_CENTS
        value: 1000000
      - key: STUDIO_PLATFORM_FEE_BPS
        value: 2000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: info@inchframe.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: Inchframe Studio <info@inchframe.com>
      - key: EMAIL_REPLY_TO
        value: info@inchframe.com
    disk:
      name: inchframe-studio-data
      mountPath: /var/data
      sizeGB: 1
