services:
  - type: web
    name: inchframe-studio
    runtime: node
    plan: starter
    region: oregon
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NEXT_PUBLIC_SITE_URL
        value: https://studio.inchframe.com
      - key: DATABASE_PATH
        value: /var/data/inchframe-studio.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: info@inchframe.com
      - key: VERIFIED_EMAIL_ALLOWLIST
        value: admin@inchframe.com
      - key: INQUIRY_NOTIFICATION_EMAIL
        value: info@inchframe.com
      - key: CREATOR_INVITE_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        value: info@inchframe.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        value: Inchframe Studio <info@inchframe.com>
      - key: EMAIL_REPLY_TO
        value: info@inchframe.com
    disk:
      name: inchframe-studio-data
      mountPath: /var/data
      sizeGB: 1
